# Runs the test suite on every upload, once with file storage and once with a real PostgreSQL database.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: citeflow
          POSTGRES_PASSWORD: citeflow
          POSTGRES_DB: citeflow_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core tesseract-ocr tesseract-ocr-eng tesseract-ocr-hun
      - name: Python packages
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Code quality (ruff)
        run: ruff check .
      - name: Tests (file storage)
        run: pytest
      - name: Tests (PostgreSQL)
        env:
          TEST_DATABASE_URL: postgresql://citeflow:citeflow@localhost:5432/citeflow_test
        run: pytest
