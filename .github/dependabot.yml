# Weekly check for security updates of the Python packages in requirements.txt
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      # The live app runs Python 3.11; numpy 2.5+ needs Python 3.12
      - dependency-name: "numpy"
        versions: [">=2.5"]
      # MoviePy 2.2.1 requires pillow<12
      - dependency-name: "pillow"
        update-types: ["version-update:semver-major"]
